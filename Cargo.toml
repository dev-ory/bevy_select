[package]
name = "bevy_select"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Composable Bevy ECS selection and directional navigation."
readme = "README.md"
documentation = "https://docs.rs/bevy_select"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "ecs", "navigation", "selection", "game-development"]
categories = ["game-development"]

[dependencies]
bevy = "0.19.1"

[features]
neighbor = []
linear = ["neighbor"]
planar = ["linear"]
spatial = ["planar"]

[package.metadata.docs.rs]
all-features = true
